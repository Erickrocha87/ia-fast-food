version: "3.8"

services:
  postgres:
    image: postgres:16
    container_name: ai-project
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_project
    ports:
      - "5432:5432"
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  redis:
    image: redis:7.2
    container_name: serveai-redis
    restart: always
    ports:
      - "6379:6379"

    command: >
      redis-server
      --appendonly yes
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data

volumes:
  redis-data: